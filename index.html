<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>리틀 스토리북 (Little Storybook) - 7세 영어 그림책</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap');

    :root {
      --bg-color: #FFF9EB;
      --card-bg: #FFFFFF;
      --primary: #FF8A3D;
      --primary-dark: #E06D22;
      --secondary: #4ECDC4;
      --secondary-dark: #36B2A9;
      --accent: #FFD166;
      --text-main: #2D3436;
      --text-sub: #636E72;
      --highlight-word: #FFF0B3;
      --highlight-border: #F5B041;
      --shadow: 0 10px 25px rgba(45, 52, 54, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#FDE6B8 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 헤더 */
    header {
      width: 100%;
      max-width: 960px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Jua', sans-serif;
      font-size: 1.6rem;
      color: var(--primary-dark);
      cursor: pointer;
    }

    .logo-badge {
      background: var(--primary);
      color: white;
      padding: 6px 12px;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      box-shadow: 0 4px 0 var(--primary-dark);
    }

    .star-counter {
      background: white;
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      color: #D98200;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid #FFE29A;
    }

    /* 메인 컨테이너 */
    main {
      width: 100%;
      max-width: 960px;
      padding: 10px 20px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 책장(홈) 화면 */
    .bookshelf-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.9rem;
      color: var(--text-main);
      margin: 10px 0 6px;
      text-align: center;
    }

    .bookshelf-sub {
      color: var(--text-sub);
      font-size: 1rem;
      margin-bottom: 28px;
      text-align: center;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      width: 100%;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 3px solid #F3E8D2;
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 32px rgba(255, 138, 61, 0.18);
      border-color: var(--primary);
    }

    .book-cover-art {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 2px solid #EFE6D5;
    }

    .book-level {
      background: #E8F8F5;
      color: var(--secondary-dark);
      font-family: 'Jua', sans-serif;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .book-title-en {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.45rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .book-title-ko {
      font-size: 1rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .btn-start {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 20px;
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--primary-dark);
      transition: transform 0.1s;
      width: 80%;
    }

    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    /* 그림책 리더 화면 */
    .reader-container {
      width: 100%;
      background: var(--card-bg);
      border-radius: 32px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 4px solid #F2E6CE;
      display: none;
      flex-direction: column;
    }

    .reader-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .btn-home {
      background: #F1F2F6;
      border: none;
      padding: 8px 16px;
      border-radius: 14px;
      font-family: 'Jua', sans-serif;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-home:hover {
      background: #E2E5EC;
    }

    .progress-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #E0E0E0;
      transition: all 0.3s;
    }

    .dot.active {
      background: var(--primary);
      transform: scale(1.25);
    }

    .dot.done {
      background: var(--secondary);
    }

    /* 일러스트 & 텍스트 영역 */
    .story-stage {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .story-stage {
        grid-template-columns: 1fr;
      }
    }

    .illustration-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 24px;
      overflow: hidden;
      border: 3px solid #EAE0CC;
      background: #F8F9FA;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.04);
    }

    .illustration-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sfx-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Jua', sans-serif;
      font-size: 0.95rem;
      color: #B7791F;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.15s;
    }

    .sfx-badge:hover {
      transform: scale(1.06);
    }

    .text-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 8px 4px;
    }

    .english-sentence {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.70rem;
      line-height: 1.55;
      color: var(--text-main);
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .word-token {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .word-token:hover {
      background: #F0F4F8;
    }

    .word-token.key-word {
      background: var(--highlight-word);
      border-bottom: 3px solid var(--highlight-border);
      font-weight: 600;
    }

    .word-token.speaking {
      background: #FFD166;
      transform: scale(1.08);
    }

    .korean-translation {
      background: #F8F9FA;
      border-left: 4px solid var(--secondary);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      color: #4A5568;
      margin-bottom: 18px;
      display: none;
      line-height: 1.5;
    }

    .korean-translation.visible {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    /* 단어 학습 미니 카드 */
    .vocab-box {
      background: #FFFDF7;
      border: 2px dashed #F5CBA7;
      border-radius: 18px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }

    .vocab-label {
      font-size: 0.85rem;
      color: #D35400;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vocab-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vocab-chip {
      background: white;
      border: 2px solid #FAD7A0;
      border-radius: 14px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .vocab-chip:hover {
      background: #FEF5E7;
      transform: translateY(-2px);
    }

    .vocab-en {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      color: #E67E22;
      font-size: 1.05rem;
    }

    .vocab-ko {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* 오디오 & 컨트롤 버튼 */
    .audio-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      flex: 1;
      min-width: 120px;
      padding: 12px 14px;
      border: none;
      border-radius: 16px;
      font-family: 'Jua', sans-serif;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
    }

    .btn-listen {
      background: var(--secondary);
      color: white;
      box-shadow: 0 4px 0 var(--secondary-dark);
    }

    .btn-listen:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--secondary-dark);
    }

    .btn-slow {
      background: #74B9FF;
      color: white;
      box-shadow: 0 4px 0 #0984E3;
    }

    .btn-slow:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0984E3;
    }

    .btn-translate {
      background: #FFEAA7;
      color: #8E6C00;
      box-shadow: 0 4px 0 #FDCB6E;
    }

    .btn-translate:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #FDCB6E;
    }

    /* 하단 페이지 이동 */
    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 2px solid #F3ECE0;
    }

    .btn-nav {
      padding: 12px 24px;
      border-radius: 18px;
      border: none;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-prev {
      background: #EDF2F7;
      color: #4A5568;
    }

    .btn-prev:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 0 var(--primary-dark);
    }

    .btn-next:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--primary-dark);
    }

    .page-indicator {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      color: var(--text-sub);
    }

    /* 독후 퀴즈 화면 */
    .quiz-container {
      display: none;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      border: 4px solid #FFE29A;
      text-align: center;
    }

    .quiz-badge {
      display: inline-block;
      background: #FFF3CD;
      color: #B7791F;
      font-family: 'Jua', sans-serif;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .quiz-question-en {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.7rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .quiz-question-ko {
      color: var(--text-sub);
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      max-width: 680px;
      margin: 0 auto 20px;
    }

    .quiz-option-btn {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .quiz-option-btn:hover {
      border-color: var(--secondary);
      background: #F0FDFB;
    }

    .quiz-option-btn.correct {
      background: #D4EDDA;
      border-color: #28A745;
      color: #155724;
    }

    .quiz-option-btn.wrong {
      background: #F8D7DA;
      border-color: #DC3545;
      color: #721C24;
    }

    .quiz-opt-en {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .quiz-opt-ko {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .feedback-msg {
      font-family: 'Jua', sans-serif;
      font-size: 1.3rem;
      min-height: 36px;
      margin-top: 10px;
    }

    /* 완료 축하 화면 */
    .reward-screen {
      display: none;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 40px 24px;
      box-shadow: var(--shadow);
      border: 4px solid #FFD166;
      text-align: center;
    }

    .trophy-svg {
      width: 140px;
      height: 140px;
      margin: 0 auto 16px;
      animation: bounce 1.5s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="goHome()">
      <span class="logo-badge">7세 영어</span>
      <span>리틀 스토리북</span>
    </div>
    <div class="star-counter">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFB800">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
      </svg>
      <span>모은 별: <strong id="star-count">0</strong>개</span>
    </div>
  </header>

  <main>
    <!-- 1. 책장 화면 -->
    <section id="bookshelf-view" style="width: 100%;">
      <h1 class="bookshelf-title">오늘 어떤 영어 그림책을 읽어볼까요?</h1>
      <p class="bookshelf-sub">그림을 보며 영어를 듣고, 노란색 단어를 눌러 뜻을 배워보아요!</p>
      <div class="book-grid" id="book-list"></div>
    </section>

    <!-- 2. 그림책 읽기 화면 -->
    <section id="reader-view" class="reader-container">
      <div class="reader-top-bar">
        <button class="btn-home" onclick="goHome()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          책장으로
        </button>
        <div class="progress-dots" id="progress-dots"></div>
        <span class="page-indicator" id="page-indicator">1 / 5</span>
      </div>

      <div class="story-stage">
        <!-- 상황 일러스트레이션 SVG 영역 -->
        <div class="illustration-frame" id="illustration-container">
          <!-- 동적 SVG 삽입 -->
        </div>

        <!-- 텍스트 및 학습 패널 -->
        <div class="text-panel">
          <div>
            <div class="english-sentence" id="english-text"></div>
            <div class="korean-translation" id="korean-text"></div>

            <div class="vocab-box">
              <div class="vocab-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#E67E22">
                  <circle cx="12" cy="12" r="10"/>
                  <text x="12" y="16" text-anchor="middle" fill="white" font-size="13" font-weight="bold">?</text>
                </svg>
                단어를 눌러 소리를 들어보세요!
              </div>
              <div class="vocab-chips" id="vocab-list"></div>
            </div>
          </div>

          <div class="audio-controls">
            <button class="btn-action btn-listen" onclick="speakCurrentSentence(0.9)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
              </svg>
              전체 듣기
            </button>
            <button class="btn-action btn-slow" onclick="speakCurrentSentence(0.65)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
              </svg>
              천천히 듣기
            </button>
            <button class="btn-action btn-translate" onclick="toggleTranslation()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04z"/>
              </svg>
              한글 뜻 보기
            </button>
          </div>
        </div>
      </div>

      <div class="nav-footer">
        <button class="btn-nav btn-prev" id="btn-prev" onclick="prevPage()">◀ 이전 장</button>
        <button class="btn-nav btn-next" id="btn-next" onclick="nextPage()">다음 장 ▶</button>
      </div>
    </section>

    <!-- 3. 독후 퀴즈 화면 -->
    <section id="quiz-view" class="quiz-container">
      <div class="quiz-badge" id="quiz-step-badge">퀴즈 1 / 2</div>
      <h2 class="quiz-question-en" id="quiz-q-en"></h2>
      <p class="quiz-question-ko" id="quiz-q-ko"></p>
      <div class="quiz-options" id="quiz-options"></div>
      <div class="feedback-msg" id="quiz-feedback"></div>
    </section>

    <!-- 4. 완독 보상 화면 -->
    <section id="reward-view" class="reward-screen">
      <svg class="trophy-svg" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="#FFF5CC"/>
        <path d="M40 30 H80 V55 C80 70 70 80 60 80 C50 80 40 70 40 55 Z" fill="#FFB800" stroke="#D98200" stroke-width="3"/>
        <path d="M40 38 H28 C25 38 25 55 40 58" fill="none" stroke="#FFB800" stroke-width="5" stroke-linecap="round"/>
        <path d="M80 38 H92 C95 38 95 55 80 58" fill="none" stroke="#FFB800" stroke-width="5" stroke-linecap="round"/>
        <rect x="54" y="80" width="12" height="16" fill="#D98200"/>
        <rect x="42" y="94" width="36" height="10" rx="5" fill="#FF8A3D"/>
        <polygon points="60,40 64,50 75,50 66,56 69,66 60,60 51,66 54,56 45,50 56,50" fill="#FFF"/>
      </svg>
      <h2 style="font-family: 'Jua', sans-serif; font-size: 2rem; color: #E06D22; margin-bottom: 10px;">
        참 잘했어요! 그림책 한 권을 다 읽었어요!
      </h2>
      <p style="font-size: 1.15rem; color: #555; margin-bottom: 24px;">
        칭찬 별 스티커 <strong>+2개</strong>를 받았어요!
      </p>
      <button class="btn-start" style="max-width: 280px;" onclick="goHome()">다른 그림책 고르기</button>
    </section>
  </main>

  <script>
    // =========================================================================
    // 1. 상황을 생생하게 묘사하는 맞춤형 SVG 일러스트레이션 데이터
    // =========================================================================
    const ILLUSTRATIONS = {
      // [책 1 표지 & 장면들: The Red Balloon]
      bear_cover: `
        <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

        ],
        quiz: [

            qEn: "What color are the puppy's boots?",
            qKo: "강아지의 장화는 무슨 색깔인가요?",
            options: [
              { en: "Red boots", ko: "빨간색 장화", correct: true },
              { en: "Yellow boots", ko: "노란색 장화", correct: false }
            ]
          },
          {
            qEn: "What shines in the sky after the rain?",
            qKo: "비가 그친 뒤 하늘에 무엇이 반짝였나요?",
            options: [
              { en: "A snowman", ko: "눈사람", correct: false },
              { en: "A rainbow", ko: "무지개", correct: true }
            ]
          }

    // =========================================================================
    // 3. 앱 상태 및 오디오/음성 엔진 (Web Speech API & Web Audio API)
    // =========================================================================
    let currentStory = null;
    let currentPageIndex = 0;
    let currentQuizIndex = 0;
    let stars = 0;
    let isTranslationVisible = false;

    function playSoundEffect(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;

        if (type === 'boing') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'wind' || type === 'rustle') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.25);
          osc.frequency.linearRampToValueAtTime(220, now + 0.55);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        } else if (type === 'bird') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
          osc.frequency.setValueAtTime(1400, now + 0.15);
          osc.frequency.exponentialRampToValueAtTime(2000, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'rain' || type === 'splash') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(250, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'happy') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + i * 0.1);
            g.gain.setValueAtTime(0.2, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.25);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.25);
          });
        }
      } catch (e) {
        console.log("Audio effect not supported", e);
      }
    }

    function speakText(text, rate = 0.88) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = rate;
      utter.pitch = 1.1;

      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang.includes('en-US') && (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google')));
      if (preferred) utter.voice = preferred;

      window.speechSynthesis.speak(utter);
    }

    // =========================================================================
    // 4. 화면 렌더링 및 인터랙션 로직
    // =========================================================================
    function initBookshelf() {
      const listEl = document.getElementById('book-list');
      listEl.innerHTML = '';

      STORIES.forEach(story => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.onclick = () => openStory(story.id);
        card.innerHTML = `
          <div class="book-cover-art">${story.coverSvg}</div>
          <span class="book-level">${story.level}</span>
          <h2 class="book-title-en">${story.titleEn}</h2>
          <p class="book-title-ko">${story.titleKo}</p>
          <button class="btn-start">그림책 읽기 ▶</button>
        `;
        listEl.appendChild(card);
      });
    }

    function goHome() {
      window.speechSynthesis.cancel();
      document.getElementById('bookshelf-view').style.display = 'block';
      document.getElementById('reader-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('reward-view').style.display = 'none';
    }

    function openStory(storyId) {
      currentStory = STORIES.find(s => s.id === storyId);
      currentPageIndex = 0;
      isTranslationVisible = false;

      document.getElementById('bookshelf-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('reward-view').style.display = 'none';
      document.getElementById('reader-view').style.display = 'flex';

      renderPage();
    }

    function renderPage() {
      const page = currentStory.pages[currentPageIndex];
      const total = currentStory.pages.length;

      document.getElementById('page-indicator').textContent = `${currentPageIndex + 1} / ${total}`;
      const dotsEl = document.getElementById('progress-dots');
      dotsEl.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === currentPageIndex ? ' active' : (i < currentPageIndex ? ' done' : ''));
        dotsEl.appendChild(dot);
      }

      const illusContainer = document.getElementById('illustration-container');
      illusContainer.innerHTML = `
        ${page.svg}
        <button class="sfx-badge" onclick="playSoundEffect('${page.sfxType}')">
          🔊 ${page.sfxName}
        </button>
      `;

      const enContainer = document.getElementById('english-text');
      enContainer.innerHTML = '';
      const keyWordsLower = page.vocab.map(v => v.word.toLowerCase());

      const words = page.en.split(' ');
      words.forEach(rawWord => {
        const cleanWord = rawWord.replace(/[^a-zA-Z]/g, '').toLowerCase();
        const span = document.createElement('span');
        span.textContent = rawWord + ' ';
        span.className = 'word-token';

        if (keyWordsLower.some(kw => kw.split(' ').includes(cleanWord)) && cleanWord.length > 1) {
          span.classList.add('key-word');
        }

        span.onclick = () => {
          span.classList.add('speaking');
          speakText(rawWord.replace(/[^a-zA-Z']/g, ''), 0.85);
          setTimeout(() => span.classList.remove('speaking'), 500);
        };

        enContainer.appendChild(span);
      });

      const koEl = document.getElementById('korean-text');
      koEl.textContent = page.ko;
      koEl.className = 'korean-translation' + (isTranslationVisible ? ' visible' : '');

      const vocabEl = document.getElementById('vocab-list');
      vocabEl.innerHTML = '';
      page.vocab.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'vocab-chip';
        chip.innerHTML = `
          <span class="vocab-en">${item.word}</span>
          <span class="vocab-ko">${item.meaning}</span>
        `;
        chip.onclick = () => speakText(item.word, 0.8);
        vocabEl.appendChild(chip);
      });

      document.getElementById('btn-prev').disabled = currentPageIndex === 0;
      const nextBtn = document.getElementById('btn-next');
      if (currentPageIndex === total - 1) {
        nextBtn.textContent = '퀴즈 풀기 ★';
      } else {
        nextBtn.textContent = '다음 장 ▶';
      }

      setTimeout(() => speakCurrentSentence(0.88), 250);
    }

    function speakCurrentSentence(rate) {
      const page = currentStory.pages[currentPageIndex];
      speakText(page.en, rate);
    }

    function toggleTranslation() {
      isTranslationVisible = !isTranslationVisible;
      const koEl = document.getElementById('korean-text');
      koEl.classList.toggle('visible', isTranslationVisible);
    }

    function prevPage() {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        renderPage();
      }
    }

    function nextPage() {
      if (currentPageIndex < currentStory.pages.length - 1) {
        currentPageIndex++;
        renderPage();
      } else {
        startQuiz();
      }
    }

    // =========================================================================
    // 5. 독후 퀴즈 및 별 스티커 보상
    // =========================================================================
    function startQuiz() {
      window.speechSynthesis.cancel();
      currentQuizIndex = 0;
      document.getElementById('reader-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      renderQuiz();
    }

    function renderQuiz() {
      const qData = currentStory.quiz[currentQuizIndex];
      document.getElementById('quiz-step-badge').textContent = `독후 퀴즈 ${currentQuizIndex + 1} / ${currentStory.quiz.length}`;
      document.getElementById('quiz-q-en').textContent = qData.qEn;
      document.getElementById('quiz-q-ko').textContent = qData.qKo;
      document.getElementById('quiz-feedback').textContent = '';

      speakText(qData.qEn, 0.88);

      const optionsEl = document.getElementById('quiz-options');
      optionsEl.innerHTML = '';

      qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option-btn';
        btn.innerHTML = `
          <span class="quiz-opt-en">${opt.en}</span>
          <span class="quiz-opt-ko">${opt.ko}</span>
        `;
        btn.onclick = () => handleQuizAnswer(btn, opt);
        optionsEl.appendChild(btn);
      });
    }

    function handleQuizAnswer(btnEl, opt) {
      const feedbackEl = document.getElementById('quiz-feedback');
      speakText(opt.en, 0.9);

      if (opt.correct) {
        btnEl.classList.add('correct');
        playSoundEffect('happy');
        feedbackEl.style.color = '#28A745';
        feedbackEl.textContent = '정답이에요! 정말 잘 읽었네요!';

        const allBtns = document.querySelectorAll('.quiz-option-btn');
        allBtns.forEach(b => b.disabled = true);

        setTimeout(() => {
          if (currentQuizIndex < currentStory.quiz.length - 1) {
            currentQuizIndex++;
            renderQuiz();
          } else {
            finishStory();
          }
        }, 1400);
      } else {
        btnEl.classList.add('wrong');
        playSoundEffect('boing');
        feedbackEl.style.color = '#E53935';
        feedbackEl.textContent = '아쉬워요! 다시 한 번 생각해볼까요?';
      }
    }

    function finishStory() {
      stars += 2;
      document.getElementById('star-count').textContent = stars;
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('reward-view').style.display = 'block';
      playSoundEffect('happy');
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    initBookshelf();
  </script>
